name: Verify recipe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - if: runner.os == 'macOS'
        run: pnpm exec playwright install chromium
      - if: runner.os == 'macOS'
        run: pnpm test:ui
      - run: pnpm package:portable
      - uses: actions/upload-artifact@v4
        with:
          name: dumpling-${{ runner.os }}-${{ runner.arch }}
          path: |
            releases/*.tar.gz
            releases/*.zip
          if-no-files-found: error
          retention-days: 14
